version: "3.9"

services:
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booksdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  fastapi-app:
    build: .
    depends_on:
      - postgres-db
    environment:
      DATABASE_URL: "postgresql://user:password@postgres-db:5432/booksdb"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata: