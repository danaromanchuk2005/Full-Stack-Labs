<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMDB Movie Review Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3b78c2;
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .negative {
            background: #fdeaea;
            color: #c62828;
        }
        .positive {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Movie Review Sentiment Analyzer</h2>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type a movie review here (e.g., 'This movie was absolutely amazing!')" required>{{ message }}</textarea>
            <button type="submit">Analyze Sentiment</button>
        </form>

        {% if result %}
            <div class="result {% if result == 'NEGATIVE' %}negative{% else %}positive{% endif %}">
                Prediction: {{ result }}
            </div>
        {% endif %}
    </div>
</body>
</html>
